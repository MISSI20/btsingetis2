<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Inscription nouveau client - Méditéranée</title>
</head>
<body bgcolor="green">
	<center>
	<header><h1>Inscription d'un nouveau client </h1></header>
	<section>
	<form method="post" action="#">
		<table width="70%" border="0">
			<tr><td><label for="nom">Nom :</label></td>
		    <td><input type="texte" id="nom" name="nom"><td></tr>
		    <tr><td><label for="prenom">Prénom :</label></td>
			<td><input type="texte" id="prenom" name="prenom"><td></tr>
			<tr><td><label for="date_naissance">Date de naissance :</label></td>
			<td><input type="date" id="dtae_naissance" name="date_naissance"><td></tr>
			<tr><td><label for="email">Adresse mail :</label></td>
			<td><input type="email" id="email" name="email"><td></tr>
			<tr><td><label for="mdp">Mot de passe :</label></td>
			<td><input type="password" id="mdp" name="mdp"><td></tr>
			<tr><td><label for="permis">Numero de permis :</label></td>
			<td><input type="text" id="permis" name="permis"><td></tr>
			<tr><td><label for="anciennete">Nombre d'années d'anciénnété :</label></td>
			<td><input type="number" id="anciennete" name="anciennete" min="0" max="80"><td></tr>
			<tr><td><label for="ville">ville :</label></td>
			<td><select id="ville" name="ville">
				<option value="paris">Paris</option>
				<option value="versailles">Versailles</option>
				<option value="creteil">Créteil</option>
			</select><td></tr>
		<tr><td><label for="adresse">Adresse du client :</label></td>
		<td><textarea id="adresse" name="adresse" rows="4" cols="30"></textarea></td></tr>
		<td><p>Situation matrimoniale :</p><td>
		<tr><td><label for="marie_oui">Marié</label></td>
		<td><input type="radio" id="marie_oui" name="marie_oui" value="oui"><td></tr>
		<tr><td><label for="marie_non">Non marié</label></td>
		<td><input type="radio" id="marie_non" name="marie" value="non"><td></tr>
		<td><p>Préférence de voiture :</p></td>
		<tr><td><label for="pref_auto">Automatique</label></td>
		<td><input type="checkbox" id="pref_auto" name="preference_auto" value="automatique"><td></tr>
		<tr><td><label for="pref-manuelle">Manuelle</label></td>
		<td><input type="checkbox" id="pref_manuelle" name="preference_manuelle" value="manuelle"><td></tr>
		<tr><td></td><td><button type="submit">Enregistrer</button>
		<button type="reset">Annuler</button></td></tr>
	</table>
	</form>
</section>
<footer>
	<p>&copy; 2026 Agence Méditérranée - Location de véhicules</p>
</footer>
</center>

</body>
</html>
